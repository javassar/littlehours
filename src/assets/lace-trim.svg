<svg xmlns="http://www.w3.org/2000/svg" width="60" height="22" viewBox="0 0 60 22" fill="none">
  <!-- Top seamless attachment band connecting to header -->
  <path d="M0 0 H60 V2.2 H0 Z" fill="#FAF7F5" />
  <line x1="0" y1="2.2" x2="60" y2="2.2" stroke="#FAF7F5" stroke-width="0.6" />

  <!-- 1. Entredoux: ladder eyelet punctures (open oval holes along top seam) -->
  <g fill="none" stroke="#FAF7F5" stroke-width="0.7" opacity="0.95">
    <line x1="0" y1="0.5" x2="0" y2="4" stroke-width="0.75" />
    <line x1="6" y1="0.5" x2="6" y2="4" stroke-width="0.75" />
    <line x1="12" y1="0.5" x2="12" y2="4" stroke-width="0.75" />
    <line x1="18" y1="0.5" x2="18" y2="4" stroke-width="0.75" />
    <line x1="24" y1="0.5" x2="24" y2="4" stroke-width="0.75" />
    <line x1="30" y1="0.5" x2="30" y2="4" stroke-width="0.75" />
    <line x1="36" y1="0.5" x2="36" y2="4" stroke-width="0.75" />
    <line x1="42" y1="0.5" x2="42" y2="4" stroke-width="0.75" />
    <line x1="48" y1="0.5" x2="48" y2="4" stroke-width="0.75" />
    <line x1="54" y1="0.5" x2="54" y2="4" stroke-width="0.75" />
    <line x1="60" y1="0.5" x2="60" y2="4" stroke-width="0.75" />
    <line x1="0" y1="4" x2="60" y2="4" stroke-width="0.65" />
  </g>

  <!-- Eyelet seed dots inside each ladder cell -->
  <g fill="#FAF7F5" opacity="0.85">
    <circle cx="3" cy="2.2" r="0.8" />
    <circle cx="9" cy="2.2" r="0.8" />
    <circle cx="15" cy="2.2" r="0.8" />
    <circle cx="21" cy="2.2" r="0.8" />
    <circle cx="27" cy="2.2" r="0.8" />
    <circle cx="33" cy="2.2" r="0.8" />
    <circle cx="39" cy="2.2" r="0.8" />
    <circle cx="45" cy="2.2" r="0.8" />
    <circle cx="51" cy="2.2" r="0.8" />
    <circle cx="57" cy="2.2" r="0.8" />
  </g>

  <!-- 2. Fine Tulle / Honeycomb Diamond Netting Ground (Reseau) inside rounded drape -->
  <g stroke="#FAF7F5" stroke-width="0.45" opacity="0.48">
    <!-- Diagonals downward right -->
    <path d="M-6 4 L6 16 M0 4 L12 16 M6 4 L18 16 M12 4 L24 16 M18 4 L30 16 M24 4 L36 16 M30 4 L42 16 M36 4 L48 16 M42 4 L54 16 M48 4 L60 16 M54 4 L66 16" />
    <!-- Diagonals downward left -->
    <path d="M6 4 L-6 16 M12 4 L0 16 M18 4 L6 16 M24 4 L12 16 M30 4 L18 16 M36 4 L24 16 M42 4 L30 16 M48 4 L36 16 M54 4 L42 16 M60 4 L48 16 M66 4 L54 16" />
  </g>

  <!-- 3. Micro-Floral Rosette and Foliage Embroidery -->
  <!-- Center 5-petal floral rosette at (30, 9) -->
  <g fill="#FAF7F5" opacity="0.92">
    <ellipse cx="30" cy="7" rx="1.2" ry="1.6" />
    <ellipse cx="32" cy="8.4" rx="1.5" ry="1.1" transform="rotate(35 32 8.4)" />
    <ellipse cx="31.2" cy="10.6" rx="1.5" ry="1.1" transform="rotate(110 31.2 10.6)" />
    <ellipse cx="28.8" cy="10.6" rx="1.5" ry="1.1" transform="rotate(-110 28.8 10.6)" />
    <ellipse cx="28" cy="8.4" rx="1.5" ry="1.1" transform="rotate(-35 28 8.4)" />
    <circle cx="30" cy="9" r="1.0" fill="#FAF7F5" />
  </g>
  <!-- Center open eyelet puncture -->
  <circle cx="30" cy="9" r="0.55" fill="#EBD9D6" opacity="0.9" />

  <!-- Left foliate vine & leaf sprig (curving naturally inside rounded scallop) -->
  <g stroke="#FAF7F5" stroke-width="0.7" fill="none" opacity="0.88">
    <path d="M26 9 C22.5 8, 18.5 9, 15 10.8 C13 12, 11 13.6, 10 15" />
  </g>
  <g fill="#FAF7F5" opacity="0.88">
    <ellipse cx="22" cy="7.8" rx="1.3" ry="0.85" transform="rotate(-25 22 7.8)" />
    <ellipse cx="18" cy="9" rx="1.2" ry="0.75" transform="rotate(30 18 9)" />
    <ellipse cx="14" cy="11.2" rx="1.2" ry="0.75" transform="rotate(-35 14 11.2)" />
    <ellipse cx="11.5" cy="13.6" rx="1.1" ry="0.7" transform="rotate(20 11.5 13.6)" />
  </g>

  <!-- Right foliate vine & leaf sprig -->
  <g stroke="#FAF7F5" stroke-width="0.7" fill="none" opacity="0.88">
    <path d="M34 9 C37.5 8, 41.5 9, 45 10.8 C47 12, 49 13.6, 50 15" />
  </g>
  <g fill="#FAF7F5" opacity="0.88">
    <ellipse cx="38" cy="7.8" rx="1.3" ry="0.85" transform="rotate(25 38 7.8)" />
    <ellipse cx="42" cy="9" rx="1.2" ry="0.75" transform="rotate(-30 42 9)" />
    <ellipse cx="46" cy="11.2" rx="1.3" ry="0.75" transform="rotate(35 46 11.2)" />
    <ellipse cx="48.5" cy="13.6" rx="1.1" ry="0.7" transform="rotate(-20 48.5 13.6)" />
  </g>

  <!-- Seamless junction florets at X=0 and X=60 -->
  <g fill="#FAF7F5" opacity="0.88">
    <ellipse cx="0" cy="5" rx="1.6" ry="1.1" />
    <ellipse cx="1.5" cy="6.4" rx="1.3" ry="0.8" transform="rotate(40 1.5 6.4)" />
    <ellipse cx="60" cy="5" rx="1.6" ry="1.1" />
    <ellipse cx="58.5" cy="6.4" rx="1.3" ry="0.8" transform="rotate(-40 58.5 6.4)" />
  </g>

  <!-- 4. Rounded Scallop Cordonnet Border Band -->
  <!-- Continuous gently curving semi-circular drape: horizontal tangent at bottom (X=30), no sharp corners -->
  <path d="M0 4.2
           C3 6.2, 7 9.5, 11 12.3
           C15 15.2, 20 17.6, 25 18.6
           C27 19, 28.5 19.3, 30 19.3
           C31.5 19.3, 33 19, 35 18.6
           C40 17.6, 45 15.2, 49 12.3
           C53 9.5, 57 6.2, 60 4.2
           L60 5.8
           C57 7.8, 53 11.1, 49 13.9
           C45 16.8, 40 19.2, 35 20.2
           C33 20.6, 31.5 20.9, 30 20.9
           C28.5 20.9, 27 20.6, 25 20.2
           C20 19.2, 15 16.8, 11 13.9
           C7 11.1, 3 7.8, 0 5.8
           Z"
        fill="#FAF7F5" opacity="0.94" />

  <!-- Inner embroidered cord highlight line tracing the round drape -->
  <path d="M0 5
           C3 7, 7 10.3, 11 13.1
           C15 16, 20 18.4, 25 19.4
           C27 19.8, 28.5 20.1, 30 20.1
           C31.5 20.1, 33 19.8, 35 19.4
           C40 18.4, 45 16, 49 13.1
           C53 10.3, 57 7, 60 5"
        stroke="#EBD9D6" stroke-width="0.35" fill="none" opacity="0.55" />

  <!-- 5. Eyelet openwork piercings following the round scallop contour -->
  <g fill="none" stroke="#FAF7F5" stroke-width="0.7" opacity="0.95">
    <!-- Center round eyelet at bottom apex -->
    <circle cx="30" cy="15.8" r="1.2" fill="#FAF7F5" fill-opacity="0.25" stroke="#FAF7F5" stroke-width="0.65" />
    <circle cx="30" cy="15.8" r="0.55" fill="#EBD9D6" stroke="none" opacity="0.8" />

    <!-- Symmetrical eyelets curving around the drape -->
    <ellipse cx="23" cy="15.1" rx="1.1" ry="1.4" transform="rotate(-18 23 15.1)" stroke="#FAF7F5" stroke-width="0.65" fill="#FAF7F5" fill-opacity="0.2" />
    <ellipse cx="37" cy="15.1" rx="1.1" ry="1.4" transform="rotate(18 37 15.1)" stroke="#FAF7F5" stroke-width="0.65" fill="#FAF7F5" fill-opacity="0.2" />

    <ellipse cx="16" cy="12.9" rx="1.1" ry="1.4" transform="rotate(-32 16 12.9)" stroke="#FAF7F5" stroke-width="0.65" fill="#FAF7F5" fill-opacity="0.2" />
    <ellipse cx="44" cy="12.9" rx="1.1" ry="1.4" transform="rotate(32 44 12.9)" stroke="#FAF7F5" stroke-width="0.65" fill="#FAF7F5" fill-opacity="0.2" />

    <ellipse cx="9.5" cy="9.8" rx="1.0" ry="1.3" transform="rotate(-45 9.5 9.8)" stroke="#FAF7F5" stroke-width="0.6" fill="#FAF7F5" fill-opacity="0.2" />
    <ellipse cx="50.5" cy="9.8" rx="1.0" ry="1.3" transform="rotate(45 50.5 9.8)" stroke="#FAF7F5" stroke-width="0.6" fill="#FAF7F5" fill-opacity="0.2" />

    <circle cx="4.5" cy="6.4" r="0.9" stroke="#FAF7F5" stroke-width="0.55" fill="#FAF7F5" fill-opacity="0.2" />
    <circle cx="55.5" cy="6.4" r="0.9" stroke="#FAF7F5" stroke-width="0.55" fill="#FAF7F5" fill-opacity="0.2" />
  </g>

  <!-- 6. Picot Fringe: delicate micro-loops and hanging droplets radiating around the round scallop -->
  <g fill="#FAF7F5" stroke="#FAF7F5" stroke-width="0.45" opacity="0.95">
    <!-- Center lowest drop floret trio at round bottom (X=30) -->
    <circle cx="30" cy="21.1" r="0.55" />
    <circle cx="28.3" cy="21.0" r="0.45" />
    <circle cx="31.7" cy="21.0" r="0.45" />

    <!-- Picot droplets following the round drape symmetrically -->
    <circle cx="25.6" cy="20.4" r="0.45" />
    <circle cx="22.7" cy="19.5" r="0.5" />
    <circle cx="19.8" cy="18.3" r="0.45" />
    <circle cx="16.9" cy="16.8" r="0.5" />
    <circle cx="14" cy="15.2" r="0.45" />
    <circle cx="11.1" cy="13.3" r="0.5" />
    <circle cx="8.3" cy="11.1" r="0.45" />
    <circle cx="5.6" cy="8.8" r="0.45" />
    <circle cx="2.8" cy="6.5" r="0.4" />

    <circle cx="34.4" cy="20.4" r="0.45" />
    <circle cx="37.3" cy="19.5" r="0.5" />
    <circle cx="40.2" cy="18.3" r="0.45" />
    <circle cx="43.1" cy="16.8" r="0.5" />
    <circle cx="46" cy="15.2" r="0.45" />
    <circle cx="48.9" cy="13.3" r="0.5" />
    <circle cx="51.7" cy="11.1" r="0.45" />
    <circle cx="54.4" cy="8.8" r="0.45" />
    <circle cx="57.2" cy="6.5" r="0.4" />

    <!-- Picot micro-loops protruding along the edge -->
    <path d="M3.5 7.2 C3.5 7.9, 4.5 7.9, 4.5 7.2" fill="none" stroke-width="0.4" />
    <path d="M9 11.5 C9 12.2, 10 12.2, 10 11.5" fill="none" stroke-width="0.4" />
    <path d="M15 15.3 C15 16, 16 16, 16 15.3" fill="none" stroke-width="0.4" />
    <path d="M21 18.5 C21 19.2, 22 19.2, 22 18.5" fill="none" stroke-width="0.4" />
    <path d="M27 20.2 C27 20.9, 28 20.9, 28 20.2" fill="none" stroke-width="0.4" />
    <path d="M32 20.2 C32 20.9, 33 20.9, 33 20.2" fill="none" stroke-width="0.4" />
    <path d="M38 18.5 C38 19.2, 39 19.2, 39 18.5" fill="none" stroke-width="0.4" />
    <path d="M44 15.3 C44 16, 45 16, 45 15.3" fill="none" stroke-width="0.4" />
    <path d="M50 11.5 C50 12.2, 51 12.2, 51 11.5" fill="none" stroke-width="0.4" />
    <path d="M55.5 7.2 C55.5 7.9, 56.5 7.9, 56.5 7.2" fill="none" stroke-width="0.4" />
  </g>
</svg>