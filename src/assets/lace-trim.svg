<svg xmlns="http://www.w3.org/2000/svg" width="60" height="22" viewBox="0 0 60 22" fill="none">
  <!-- Top seamless attachment band connecting to header -->
  <path d="M0 0 H60 V2.5 H0 Z" fill="#FAF7F5" />
  <line x1="0" y1="2.5" x2="60" y2="2.5" stroke="#FAF7F5" stroke-width="0.6" />

  <!-- 1. Entredoux: ladder eyelet punctures (open oval holes along top seam) -->
  <g fill="none" stroke="#FAF7F5" stroke-width="0.75" opacity="0.95">
    <!-- Connecting vertical ladder rungs -->
    <line x1="0" y1="0.5" x2="0" y2="4.5" stroke-width="0.8" />
    <line x1="6" y1="0.5" x2="6" y2="4.5" stroke-width="0.8" />
    <line x1="12" y1="0.5" x2="12" y2="4.5" stroke-width="0.8" />
    <line x1="18" y1="0.5" x2="18" y2="4.5" stroke-width="0.8" />
    <line x1="24" y1="0.5" x2="24" y2="4.5" stroke-width="0.8" />
    <line x1="30" y1="0.5" x2="30" y2="4.5" stroke-width="0.8" />
    <line x1="36" y1="0.5" x2="36" y2="4.5" stroke-width="0.8" />
    <line x1="42" y1="0.5" x2="42" y2="4.5" stroke-width="0.8" />
    <line x1="48" y1="0.5" x2="48" y2="4.5" stroke-width="0.8" />
    <line x1="54" y1="0.5" x2="54" y2="4.5" stroke-width="0.8" />
    <line x1="60" y1="0.5" x2="60" y2="4.5" stroke-width="0.8" />
    <!-- Horizontal guide thread -->
    <line x1="0" y1="4.5" x2="60" y2="4.5" stroke-width="0.7" />
  </g>

  <!-- Eyelet seed dots inside each ladder cell -->
  <g fill="#FAF7F5" opacity="0.85">
    <circle cx="3" cy="2.5" r="0.9" />
    <circle cx="9" cy="2.5" r="0.9" />
    <circle cx="15" cy="2.5" r="0.9" />
    <circle cx="21" cy="2.5" r="0.9" />
    <circle cx="27" cy="2.5" r="0.9" />
    <circle cx="33" cy="2.5" r="0.9" />
    <circle cx="39" cy="2.5" r="0.9" />
    <circle cx="45" cy="2.5" r="0.9" />
    <circle cx="51" cy="2.5" r="0.9" />
    <circle cx="57" cy="2.5" r="0.9" />
  </g>

  <!-- 2. Fine Tulle / Honeycomb Diamond Netting Ground (Reseau) -->
  <g stroke="#FAF7F5" stroke-width="0.5" opacity="0.55">
    <!-- Diagonals downward right -->
    <path d="M-6 4.5 L6 14.5 M0 4.5 L12 14.5 M6 4.5 L18 14.5 M12 4.5 L24 14.5 M18 4.5 L30 14.5 M24 4.5 L36 14.5 M30 4.5 L42 14.5 M36 4.5 L48 14.5 M42 4.5 L54 14.5 M48 4.5 L60 14.5 M54 4.5 L66 14.5" />
    <!-- Diagonals downward left -->
    <path d="M6 4.5 L-6 14.5 M12 4.5 L0 14.5 M18 4.5 L6 14.5 M24 4.5 L12 14.5 M30 4.5 L18 14.5 M36 4.5 L24 14.5 M42 4.5 L30 14.5 M48 4.5 L36 14.5 M54 4.5 L42 14.5 M60 4.5 L48 14.5 M66 4.5 L54 14.5" />
  </g>

  <!-- 3. Micro-Floral Rosette and Foliage Embroidery -->
  <!-- Center 5-petal floral rosette at (30, 8.5) -->
  <g fill="#FAF7F5" opacity="0.92">
    <!-- Petals -->
    <ellipse cx="30" cy="6.2" rx="1.3" ry="1.9" />
    <ellipse cx="32.4" cy="7.8" rx="1.8" ry="1.3" transform="rotate(35 32.4 7.8)" />
    <ellipse cx="31.6" cy="10.2" rx="1.8" ry="1.3" transform="rotate(110 31.6 10.2)" />
    <ellipse cx="28.4" cy="10.2" rx="1.8" ry="1.3" transform="rotate(-110 28.4 10.2)" />
    <ellipse cx="27.6" cy="7.8" rx="1.8" ry="1.3" transform="rotate(-35 27.6 7.8)" />
    <!-- Center stamen ring -->
    <circle cx="30" cy="8.5" r="1.1" fill="#FAF7F5" />
  </g>
  <!-- Center open eyelet puncture -->
  <circle cx="30" cy="8.5" r="0.6" fill="#F6EDEA" opacity="0.9" />

  <!-- Left vine & leaf sprig (X: 13 to 22) -->
  <g stroke="#FAF7F5" stroke-width="0.75" fill="none" opacity="0.9">
    <path d="M26 8.5 C23 7.5, 20 8.2, 17 9.5 C15.5 10.2, 14 11, 13 12" />
  </g>
  <g fill="#FAF7F5" opacity="0.88">
    <ellipse cx="22" cy="7.4" rx="1.4" ry="0.9" transform="rotate(-25 22 7.4)" />
    <ellipse cx="18" cy="8.3" rx="1.3" ry="0.8" transform="rotate(30 18 8.3)" />
    <ellipse cx="14" cy="10.2" rx="1.4" ry="0.9" transform="rotate(-40 14 10.2)" />
  </g>

  <!-- Right vine & leaf sprig (X: 38 to 47) -->
  <g stroke="#FAF7F5" stroke-width="0.75" fill="none" opacity="0.9">
    <path d="M34 8.5 C37 7.5, 40 8.2, 43 9.5 C44.5 10.2, 46 11, 47 12" />
  </g>
  <g fill="#FAF7F5" opacity="0.88">
    <ellipse cx="38" cy="7.4" rx="1.4" ry="0.9" transform="rotate(25 38 7.4)" />
    <ellipse cx="42" cy="8.3" rx="1.3" ry="0.8" transform="rotate(-30 42 8.3)" />
    <ellipse cx="46" cy="10.2" rx="1.4" ry="0.9" transform="rotate(40 46 10.2)" />
  </g>

  <!-- Seamless junction florets at X=0 and X=60 -->
  <g fill="#FAF7F5" opacity="0.88">
    <!-- Right half of floret at X=0 -->
    <ellipse cx="0" cy="6" rx="1.8" ry="1.2" />
    <ellipse cx="1.6" cy="7.6" rx="1.4" ry="0.9" transform="rotate(40 1.6 7.6)" />
    <!-- Left half of floret at X=60 -->
    <ellipse cx="60" cy="6" rx="1.8" ry="1.2" />
    <ellipse cx="58.4" cy="7.6" rx="1.4" ry="0.9" transform="rotate(-40 58.4 7.6)" />
  </g>

  <!-- 4. Ornate Compound Scallop Border Band (Cordonnet) -->
  <!-- Dense embroidered scallop ribbon contour with 7 micro-lobes -->
  <path d="M0 6
           C2.5 7.5, 5.5 8.8, 8 9.5
           C10.5 10.2, 14 12, 16.5 13.5
           C19 15, 22 16.8, 25 17.5
           C27 18, 28.5 19.8, 30 19.8
           C31.5 19.8, 33 18, 35 17.5
           C38 16.8, 41 15, 43.5 13.5
           C46 12, 49.5 10.2, 52 9.5
           C54.5 8.8, 57.5 7.5, 60 6
           L60 7.8
           C57.5 9.3, 54.5 10.6, 52 11.3
           C49.5 12, 46 13.8, 43.5 15.3
           C41 16.8, 38 18.6, 35 19.3
           C33 19.8, 31.5 21.6, 30 21.6
           C28.5 21.6, 27 19.8, 25 19.3
           C22 18.6, 19 16.8, 16.5 15.3
           C14 13.8, 10.5 12, 8 11.3
           C5.5 10.6, 2.5 9.3, 0 7.8
           Z"
        fill="#FAF7F5" opacity="0.94" />

  <!-- Secondary inner cord detail line -->
  <path d="M0 6.9
           C2.5 8.4, 5.5 9.7, 8 10.4
           C10.5 11.1, 14 12.9, 16.5 14.4
           C19 15.9, 22 17.7, 25 18.4
           C27 18.9, 28.5 20.7, 30 20.7
           C31.5 20.7, 33 18.9, 35 18.4
           C38 17.7, 41 15.9, 43.5 14.4
           C46 12.9, 49.5 11.1, 52 10.4
           C54.5 9.7, 57.5 8.4, 60 6.9"
        stroke="#E6D3CE" stroke-width="0.4" fill="none" opacity="0.6" />

  <!-- 5. Eyelet openwork piercings inside the scallop band -->
  <!-- Center drop teardrop eyelet -->
  <g fill="none" stroke="#FAF7F5" stroke-width="0.75" opacity="0.95">
    <!-- Center vertical teardrop eyelet at (30, 15.5) -->
    <path d="M30 13.8 C28.6 15.2, 28.8 17.2, 30 17.8 C31.2 17.2, 31.4 15.2, 30 13.8 Z" fill="#FAF7F5" fill-opacity="0.25" stroke="#FAF7F5" stroke-width="0.7" />
    <!-- Symmetrical oval eyelets -->
    <ellipse cx="21" cy="13.2" rx="1.3" ry="1.7" transform="rotate(-25 21 13.2)" stroke="#FAF7F5" stroke-width="0.7" fill="#FAF7F5" fill-opacity="0.2" />
    <ellipse cx="39" cy="13.2" rx="1.3" ry="1.7" transform="rotate(25 39 13.2)" stroke="#FAF7F5" stroke-width="0.7" fill="#FAF7F5" fill-opacity="0.2" />
    <ellipse cx="12.5" cy="10.2" rx="1.2" ry="1.5" transform="rotate(-20 12.5 10.2)" stroke="#FAF7F5" stroke-width="0.7" fill="#FAF7F5" fill-opacity="0.2" />
    <ellipse cx="47.5" cy="10.2" rx="1.2" ry="1.5" transform="rotate(20 47.5 10.2)" stroke="#FAF7F5" stroke-width="0.7" fill="#FAF7F5" fill-opacity="0.2" />
    <circle cx="5" cy="7.2" r="1.1" stroke="#FAF7F5" stroke-width="0.65" fill="#FAF7F5" fill-opacity="0.2" />
    <circle cx="55" cy="7.2" r="1.1" stroke="#FAF7F5" stroke-width="0.65" fill="#FAF7F5" fill-opacity="0.2" />
  </g>

  <!-- 6. Picot Fringe: delicate micro-loops and hanging droplets along the bottom edge -->
  <g fill="#FAF7F5" stroke="#FAF7F5" stroke-width="0.5" opacity="0.95">
    <!-- Center lowest drop floret (X=30) -->
    <circle cx="30" cy="21.6" r="0.7" />
    <circle cx="28.4" cy="20.8" r="0.55" />
    <circle cx="31.6" cy="20.8" r="0.55" />

    <!-- Lobe 3 & 5 picots -->
    <circle cx="26.5" cy="19" r="0.6" />
    <circle cx="23.5" cy="17.8" r="0.55" />
    <circle cx="20.5" cy="16.5" r="0.6" />
    <circle cx="33.5" cy="19" r="0.6" />
    <circle cx="36.5" cy="17.8" r="0.55" />
    <circle cx="39.5" cy="16.5" r="0.6" />

    <!-- Lobe 2 & 6 picots -->
    <circle cx="17.5" cy="14.8" r="0.55" />
    <circle cx="14.5" cy="13.2" r="0.6" />
    <circle cx="11.5" cy="11.8" r="0.55" />
    <circle cx="42.5" cy="14.8" r="0.55" />
    <circle cx="45.5" cy="13.2" r="0.6" />
    <circle cx="48.5" cy="11.8" r="0.55" />

    <!-- Lobe 1 & 7 picots -->
    <circle cx="8.5" cy="10.2" r="0.55" />
    <circle cx="5.5" cy="8.8" r="0.6" />
    <circle cx="2.5" cy="7.5" r="0.55" />
    <circle cx="51.5" cy="10.2" r="0.55" />
    <circle cx="54.5" cy="8.8" r="0.6" />
    <circle cx="57.5" cy="7.5" r="0.55" />

    <!-- Picot micro-loops protruding along the edge -->
    <path d="M2.5 8.2 C2.5 9, 3.5 9, 3.5 8.2" fill="none" stroke-width="0.5" />
    <path d="M7.5 10.8 C7.5 11.6, 8.5 11.6, 8.5 10.8" fill="none" stroke-width="0.5" />
    <path d="M13.5 13.8 C13.5 14.6, 14.5 14.6, 14.5 13.8" fill="none" stroke-width="0.5" />
    <path d="M19.5 17.2 C19.5 18, 20.5 18, 20.5 17.2" fill="none" stroke-width="0.5" />
    <path d="M25.5 19.8 C25.5 20.6, 26.5 20.6, 26.5 19.8" fill="none" stroke-width="0.5" />
    <path d="M33.5 19.8 C33.5 20.6, 34.5 20.6, 34.5 19.8" fill="none" stroke-width="0.5" />
    <path d="M39.5 17.2 C39.5 18, 40.5 18, 40.5 17.2" fill="none" stroke-width="0.5" />
    <path d="M45.5 13.8 C45.5 14.6, 46.5 14.6, 46.5 13.8" fill="none" stroke-width="0.5" />
    <path d="M51.5 10.8 C51.5 11.6, 52.5 11.6, 52.5 10.8" fill="none" stroke-width="0.5" />
    <path d="M56.5 8.2 C56.5 9, 57.5 9, 57.5 8.2" fill="none" stroke-width="0.5" />
  </g>
</svg>